services:
  backend:
    build: .
    container_name: pdf-backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=YOUR_GROQ_KEY_HERE
    volumes:
      - ./data:/app/data

  frontend:
    build: ./frontend
    container_name: pdf-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
    depends_on:
      - backend